[project]
name = "greenroute"
version = "0.0.1"
description = "Open benchmark for LLM inference energy per completed task at matched quality."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["modal", "pytest"]
gpu = ["nvidia-ml-py"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["greenroute"]
